[package]
name = "mycelium-std-conformance"
version.workspace = true
description = "Standard-library port-conformance test harness (M-971; RFC-0031 D5/D6): the three-way differential (L1-eval ≡ elaborate→L0-interp ≡ AOT) between each `lib/std/<name>.myc` nodule port and its retained Rust `mycelium-std-<name>` oracle. Relocated out of `mycelium-l1` (M-971) so the trusted `core`-tier L1 crate no longer dev-depends on the `std`-tier oracle crates — the tests legitimately live in this higher-tier crate that may depend on both. Test-only: the crate has no library surface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Test-only crate: the port-differential integration tests in `tests/` drive the L1 frontend, the
# reference interpreter, the AOT env-machine, and the shared M-210 checker against each ported
# `.myc` nodule, and compare against the retained Rust std oracle (RFC-0031 D6 — the oracle crates
# are NOT retired). All dependencies are dev-dependencies (the crate exports no library items), so
# this crate has zero in-workspace NORMAL deps (stratum 0) and no crate depends on it (a sink) —
# it participates in no dependency cycle. It sits at the `std` tier because it depends on the
# `std`-tier oracle crates; its downward deps on the `core`-tier L1 stack (l1/interp/cert/mlir) are
# tier-legal (std -> core). See xtask/deps-strata.toml + DN-68.
[dev-dependencies]
# The L1 frontend + trusted execution stack the shared harness drives (three-way differential).
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "57ef45b453eef1f02bdfb1f0cad1034dabd32b1f" }
mycelium-l1 = { git = "https://github.com/tzervas/mycelium-l1", rev = "4e4a29679d8e941eab86fad40f49c9947e68eefd" }
mycelium-interp = { git = "https://github.com/tzervas/mycelium-runtime", rev = "7842042d770108b2d179ff2874f1871dc4821604" }
mycelium-cert = { git = "https://github.com/tzervas/mycelium-runtime", rev = "7842042d770108b2d179ff2874f1871dc4821604" }
mycelium-mlir = { git = "https://github.com/tzervas/mycelium-codegen", rev = "b1e53b7c57597215ba65402af33551467c576bd3" }
# The retained Rust oracles (RFC-0031 D6, test scope only; crates not retired). Each `std_<name>.rs`
# differential compares its `.myc` port against the ACTUAL public surface of the matching oracle.
mycelium-std-content = { git = "https://github.com/tzervas/mycelium-std-content", rev = "da8e5a3aabeab6d1453c3769bd346ebbdc93477c" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "19398dfd847eb9a5fc518149a714d7646abbb316" }
mycelium-std-diag = { git = "https://github.com/tzervas/mycelium-std-diag", rev = "e2f67c1fffe5605189ca9d8ba1c761102ccdb63f" }
mycelium-std-error = { git = "https://github.com/tzervas/mycelium-std-error", rev = "cbd40b4cee36c590d88e3cd73813694d4154daf9" }
mycelium-std-numerics = { git = "https://github.com/tzervas/mycelium-std-numerics", rev = "f411b8c6d1c473efaf11b649b9921bd787069369" }
mycelium-std-recover = { git = "https://github.com/tzervas/mycelium-std-recover", rev = "f64117e5e0b0dc9a09aca217787dd0ae087c7aa3" }
mycelium-std-select = { git = "https://github.com/tzervas/mycelium-std-select", rev = "61aff4f89ee3a85c24b5757b49e9c0c64e79414d" }
mycelium-std-spore = { git = "https://github.com/tzervas/mycelium-std-spore", rev = "52fb3f73db4910907e5e0cbbb0f0331d48a208fd" }
mycelium-std-swap = { git = "https://github.com/tzervas/mycelium-std-swap", rev = "dafc625844cc39ce2865dc9df5b12bd80420e98e" }
mycelium-std-ternary = { git = "https://github.com/tzervas/mycelium-std-ternary", rev = "8d0c182c1b16ad7419822b5b62f3835daa6920c9" }
mycelium-std-testing = { git = "https://github.com/tzervas/mycelium-std-testing", rev = "f9917f7e8a002ec3a1a8eb9e0a392dd830b47dd6" }
mycelium-std-time = { git = "https://github.com/tzervas/mycelium-std-time", rev = "180f148134cc8d0750ddf68ca612418c7a4d3713" }
