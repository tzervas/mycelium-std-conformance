[package]
name = "mycelium-std-conformance"
version.workspace = true
description = "Standard-library port-conformance test harness (M-971; RFC-0031 D5/D6): the three-way differential (L1-eval ≡ elaborate→L0-interp ≡ AOT) between each `lib/std/<name>.myc` nodule port and its retained Rust `mycelium-std-<name>` oracle. Relocated out of `mycelium-l1` (M-971) so the trusted `core`-tier L1 crate no longer dev-depends on the `std`-tier oracle crates — the tests legitimately live in this higher-tier crate that may depend on both. Test-only: the crate has no library surface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Test-only crate: the port-differential integration tests in `tests/` drive the L1 frontend, the
# reference interpreter, the AOT env-machine, and the shared M-210 checker against each ported
# `.myc` nodule, and compare against the retained Rust std oracle (RFC-0031 D6 — the oracle crates
# are NOT retired). All dependencies are dev-dependencies (the crate exports no library items), so
# this crate has zero in-workspace NORMAL deps (stratum 0) and no crate depends on it (a sink) —
# it participates in no dependency cycle. It sits at the `std` tier because it depends on the
# `std`-tier oracle crates; its downward deps on the `core`-tier L1 stack (l1/interp/cert/mlir) are
# tier-legal (std -> core). See xtask/deps-strata.toml + DN-68.
[dev-dependencies]
# The L1 frontend + trusted execution stack the shared harness drives (three-way differential).
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "57ef45b453eef1f02bdfb1f0cad1034dabd32b1f" }
mycelium-l1 = { git = "https://github.com/tzervas/mycelium-l1", rev = "1d422648d6f41e1077c8f8b7ae7c7e38b2bd254f" }
mycelium-interp = { git = "https://github.com/tzervas/mycelium-runtime", rev = "2317cd1694496b72225213a9fdc59407a907b495" }
mycelium-cert = { git = "https://github.com/tzervas/mycelium-runtime", rev = "2317cd1694496b72225213a9fdc59407a907b495" }
mycelium-mlir = { git = "https://github.com/tzervas/mycelium-codegen", rev = "5a8638de9f964e8f1136751b0ec78f4014562353" }
# The retained Rust oracles (RFC-0031 D6, test scope only; crates not retired). Each `std_<name>.rs`
# differential compares its `.myc` port against the ACTUAL public surface of the matching oracle.
mycelium-std-content = { git = "https://github.com/tzervas/mycelium-std-content", rev = "da8e5a3aabeab6d1453c3769bd346ebbdc93477c" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "276d6a1aa75b2aa15accc06bdc32886e9cf54bc4" }
mycelium-std-diag = { git = "https://github.com/tzervas/mycelium-std-diag", rev = "686e958927b38b5f961f84e2d8bf62a191353b20" }
mycelium-std-error = { git = "https://github.com/tzervas/mycelium-std-error", rev = "fc8fa9dad041d0293163db760b1cdfc3454457cd" }
mycelium-std-numerics = { git = "https://github.com/tzervas/mycelium-std-numerics", rev = "dae23744d4d915a67bb821ab8b76d23c40eeb65d" }
mycelium-std-recover = { git = "https://github.com/tzervas/mycelium-std-recover", rev = "b5de97f183928578508a9a3296228e52b9a4c07c" }
mycelium-std-select = { git = "https://github.com/tzervas/mycelium-std-select", rev = "fd450c7520e324eed20c8f3aaf1baa436cbbe3bd" }
mycelium-std-spore = { git = "https://github.com/tzervas/mycelium-std-spore", rev = "2a064ca4fc2230cd4be74232699fbd6a0c2695b8" }
mycelium-std-swap = { git = "https://github.com/tzervas/mycelium-std-swap", rev = "db305aa204423445dc17ab0535b08062242f1b36" }
mycelium-std-ternary = { git = "https://github.com/tzervas/mycelium-std-ternary", rev = "ec25bbeb2838322ebd855f586ec40fd77ccf05c6" }
mycelium-std-testing = { git = "https://github.com/tzervas/mycelium-std-testing", rev = "177d1ca2dbd728d5419e2a22ea708be30b83af1c" }
mycelium-std-time = { git = "https://github.com/tzervas/mycelium-std-time", rev = "cc594116bd29db3520135143dd567844a2f75205" }
