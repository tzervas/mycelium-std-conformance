[package]
name = "mycelium-std-conformance"
version.workspace = true
description = "Standard-library port-conformance test harness (M-971; RFC-0031 D5/D6): the three-way differential (L1-eval ≡ elaborate→L0-interp ≡ AOT) between each `lib/std/<name>.myc` nodule port and its retained Rust `mycelium-std-<name>` oracle. Relocated out of `mycelium-l1` (M-971) so the trusted `core`-tier L1 crate no longer dev-depends on the `std`-tier oracle crates — the tests legitimately live in this higher-tier crate that may depend on both. Test-only: the crate has no library surface."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Test-only crate: the port-differential integration tests in `tests/` drive the L1 frontend, the
# reference interpreter, the AOT env-machine, and the shared M-210 checker against each ported
# `.myc` nodule, and compare against the retained Rust std oracle (RFC-0031 D6 — the oracle crates
# are NOT retired). All dependencies are dev-dependencies (the crate exports no library items), so
# this crate has zero in-workspace NORMAL deps (stratum 0) and no crate depends on it (a sink) —
# it participates in no dependency cycle. It sits at the `std` tier because it depends on the
# `std`-tier oracle crates; its downward deps on the `core`-tier L1 stack (l1/interp/cert/mlir) are
# tier-legal (std -> core). See xtask/deps-strata.toml + DN-68.
[dev-dependencies]
# The L1 frontend + trusted execution stack the shared harness drives (three-way differential).
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "3958d2ea3c3921611e33f1f00e3469b29a939a76" }
mycelium-l1 = { git = "https://github.com/tzervas/mycelium-l1", rev = "09dc66df09cafb8cc9fc65e1743adeb74faf4e3f" }
mycelium-interp = { git = "https://github.com/tzervas/mycelium-runtime", rev = "f9e7c3946836c91848a5b6de13ed9dc61665c4fd" }
mycelium-cert = { git = "https://github.com/tzervas/mycelium-runtime", rev = "f9e7c3946836c91848a5b6de13ed9dc61665c4fd" }
mycelium-mlir = { git = "https://github.com/tzervas/mycelium-codegen", rev = "35e72c390a5697d1ea5ab6266d61e9f5894fa6bc" }
# The retained Rust oracles (RFC-0031 D6, test scope only; crates not retired). Each `std_<name>.rs`
# differential compares its `.myc` port against the ACTUAL public surface of the matching oracle.
mycelium-std-content = { git = "https://github.com/tzervas/mycelium-std-content", rev = "93db7c19c2ab0f0d3860f27107422b94f684ba56" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "f530c3db59a35fbb5769356555bda09997e96a1f" }
mycelium-std-diag = { git = "https://github.com/tzervas/mycelium-std-diag", rev = "2daedeaa362d1b35c1e88ec618e53283e35255bb" }
mycelium-std-error = { git = "https://github.com/tzervas/mycelium-std-error", rev = "fd3bdf4be5c2e881d5a376eeabb834aa27da2261" }
mycelium-std-numerics = { git = "https://github.com/tzervas/mycelium-std-numerics", rev = "0e5262e5e9f20cd9752c16b725eb6ed7b211c9ee" }
mycelium-std-recover = { git = "https://github.com/tzervas/mycelium-std-recover", rev = "9dcd8433e247fd4b6ca233e1ba91928cbd8cb0ea" }
mycelium-std-select = { git = "https://github.com/tzervas/mycelium-std-select", rev = "ec57277db81d1130eeb94dbf0a902d2f56f6a8ed" }
mycelium-std-spore = { git = "https://github.com/tzervas/mycelium-std-spore", rev = "8d16f79c5b769a80ada739abf7e3ea8cb177fd53" }
mycelium-std-swap = { git = "https://github.com/tzervas/mycelium-std-swap", rev = "8af0e778246cf9bbdf948e9a65e11e4520a89b7b" }
mycelium-std-ternary = { git = "https://github.com/tzervas/mycelium-std-ternary", rev = "c5bae3fb0db88fab731a578eb89c99a93178f385" }
mycelium-std-testing = { git = "https://github.com/tzervas/mycelium-std-testing", rev = "be6c29ea9b5b6449ee678df0db074f2a6de7a38a" }
mycelium-std-time = { git = "https://github.com/tzervas/mycelium-std-time", rev = "767abd9688b21d369c1186a1c82f71d3c28f3867" }
